services:
  postgres:
    image: postgres:18-alpine
    container_name: humanshield-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishaware}
      POSTGRES_USER: ${POSTGRES_USER:-phishaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishaware}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - humanshield

  redis:
    image: redis:8-alpine
    container_name: humanshield-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - humanshield

  # Anhang-Pruefung fuer gemeldete Mails (Enterprise). Bewusst hinter einem
  # Profil und damit standardmaessig AUS: clamd haelt die Signaturdatenbank
  # vollstaendig im Speicher (real 1,5-2 GB) und wuerde die Mindestanforderung
  # jeder Installation anheben - auch der vielen, die nie eine Mail melden.
  #
  #   docker compose --profile scanning up -d
  #
  # Danach unter Einstellungen -> Anhang-Pruefung Host "clamav", Port 3310.
  #
  # Fuer Installationen ohne Internet: freshclam kommt nicht an die Signaturen
  # und die Datenbank veraltet still. Dort entweder die Signaturen per Spiegel
  # einbinden oder die Pruefung ausgeschaltet lassen - eine veraltete
  # Signaturdatenbank ist schlimmer als keine, weil sie Sicherheit vortaeuscht.
  clamav:
    image: clamav/clamav:stable
    container_name: humanshield-clamav
    profiles:
      - scanning
    restart: unless-stopped
    healthcheck:
      # clamd braucht nach dem Start mehrere Minuten, um die Signaturen zu
      # laden. Bis dahin ist der Container absichtlich "starting".
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - humanshield

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: humanshield-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - humanshield

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: humanshield-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WIKI_URL: ${VITE_WIKI_URL:-}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
    command: npm run dev
    networks:
      - humanshield

  caddy:
    image: caddy:2-alpine
    container_name: humanshield-proxy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - humanshield

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  # Signaturdatenbank von ClamAV - ohne eigenes Volume laedt sie der
  # Container nach jedem Neustart erneut (mehrere hundert MB).
  clamav_data:

networks:
  humanshield:
    driver: bridge