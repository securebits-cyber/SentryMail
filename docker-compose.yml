services:
  postgres:
    image: postgres:18-alpine
    container_name: sentrymail-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishaware}
      POSTGRES_USER: ${POSTGRES_USER:-phishaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishaware}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentrymail

  redis:
    image: redis:8-alpine
    container_name: sentrymail-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentrymail

  # Anhang-Pruefung fuer gemeldete Mails (Enterprise). Bewusst hinter einem
  # Profil und damit standardmaessig AUS: clamd haelt die Signaturdatenbank
  # vollstaendig im Speicher (real 1,5-2 GB) und wuerde die Mindestanforderung
  # jeder Installation anheben - auch der vielen, die nie eine Mail melden.
  #
  #   docker compose --profile scanning up -d
  #
  # Danach unter Einstellungen -> Anhang-Pruefung Host "clamav", Port 3310.
  #
  # Fuer Installationen ohne Internet: freshclam kommt nicht an die Signaturen
  # und die Datenbank veraltet still. Dort entweder die Signaturen per Spiegel
  # einbinden oder die Pruefung ausgeschaltet lassen - eine veraltete
  # Signaturdatenbank ist schlimmer als keine, weil sie Sicherheit vortaeuscht.
  clamav:
    image: clamav/clamav:stable
    container_name: sentrymail-clamav
    profiles:
      - scanning
    restart: unless-stopped
    healthcheck:
      # clamd braucht nach dem Start mehrere Minuten, um die Signaturen zu
      # laden. Bis dahin ist der Container absichtlich "starting".
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - sentrymail

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrymail-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Vom Backend geschriebene Dateien (z. B. LMS-Videos bei
      # LMS_STORAGE_BACKEND=filesystem). Ohne eigenes Volume laegen sie in der
      # Container-Schicht und waeren nach jedem Rebuild weg.
      - backend_data:/app/data
    networks:
      - sentrymail

  # Gebautes Frontend, statisch ausgeliefert. Der Port wird bewusst nicht auf
  # den Host veroeffentlicht - erreichbar ist das Frontend nur ueber Caddy.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite setzt diese Werte zur Bauzeit fest ein. Aenderungen in der .env
      # wirken deshalb erst nach "docker compose build frontend".
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WIKI_URL: ${VITE_WIKI_URL:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    container_name: sentrymail-web
    depends_on:
      - backend
    networks:
      - sentrymail

  caddy:
    image: caddy:2-alpine
    container_name: sentrymail-proxy
    # FRONTEND_BIND_ADDRESS begrenzt, auf welcher Netzwerkschnittstelle das
    # Dashboard ueberhaupt antwortet. Ohne Angabe hoert es auf allen - bei einer
    # Maschine mit oeffentlicher IP heisst das: offen im Internet.
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - sentrymail

volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:
  # Signaturdatenbank von ClamAV - ohne eigenes Volume laedt sie der
  # Container nach jedem Neustart erneut (mehrere hundert MB).
  clamav_data:

networks:
  sentrymail:
    driver: bridge